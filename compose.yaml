name: respawn

services:
  postgres:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-respawn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-respawn_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-respawn}
      POSTGRES_INITDB_ARGS: --data-checksums
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-respawn} -d ${POSTGRES_DB:-respawn}
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s

volumes:
  postgres_data:
